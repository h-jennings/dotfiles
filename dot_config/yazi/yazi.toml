# Fetchers run in the background as files are listed. Both entries are needed:
# `*` matches files, `*/` matches directories (which get the summarized status
# of everything beneath them).
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
