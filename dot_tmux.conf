unbind C-b
set -g prefix C-a

# Enables vim keybindings
setw -g mode-keys vi

# Recommended by neovim
set-option -sg escape-time 10
set-option -g focus-events on

set -ag terminal-overrides ",*256col*:RGB"

# Enable undercurl support
set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Enable mouse mode
set -g mouse on

unbind '"'
unbind %

# Enhanced copy mode bindings
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi 'Y' send -X copy-line
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle
bind-key -T copy-mode-vi 'A' send -X append-selection
bind-key -T copy-mode-vi 'D' send -X copy-end-of-line

# Copy to system clipboard
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Window navigation
bind p previous-window
bind n next-window

# Paste from clipboard
bind C-p paste-buffer
bind P choose-buffer

# reload configuration
unbind r
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

# toggle theme
bind T run-shell '~/.config/tmux/auto-theme.sh toggle && ~/.config/tmux/auto-theme.sh'

# Force pane layout
bind v select-layout even-vertical    # stacked: panes top/bottom
bind b select-layout even-horizontal  # beside: panes left/right

# Pane resizing with Alt + arrow keys
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5

# Window management
bind -n S-Left previous-window
bind -n S-Right next-window
bind c new-window -c "#{pane_current_path}"

# Session management
bind C-s choose-session
bind S new-session

# Lazygit
bind g split-window -h -c "#{pane_current_path}" "lazygit"
bind G if-shell 'tmux select-window -t git' '' 'new-window -n git -c "#{pane_current_path}" lazygit'

# --- Display ---
set -g base-index 1
setw -g pane-base-index 1

setw -g automatic-rename on
set -g renumber-windows on

set -g set-titles on

set -g display-panes-time 800
set -g display-time 1000

set -g status-interval 10

# Activity monitoring
set -g monitor-activity on
set -g visual-activity off
set -g monitor-bell on
set -g visual-bell off
set -g visual-silence off
set -g bell-action other

# History and scrollback
set -g history-limit 10000

# Enable aggressive resize
setw -g aggressive-resize on

# Session behavior
set -g detach-on-destroy off

### PLUGIN CONFIGURATION ###

# tmux-resurrect
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh psql mysql sqlite3'

# tmux-continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-yank
set -g @yank_selection 'primary'
set -g @yank_selection_mouse 'clipboard'

### THEME ###

set -g status-position top
set -g status-justify left

# Auto-detect system appearance and apply colors
run-shell '~/.config/tmux/auto-theme.sh'

# Re-apply on focus so theme tracks macOS appearance changes
set-hook -g client-focus-in "run-shell '~/.config/tmux/auto-theme.sh'"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'
